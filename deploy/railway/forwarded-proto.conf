# Trust the edge proxy's TLS termination (Railway).
#
# Railway terminates TLS at its edge and forwards to this container over plain
# HTTP with X-Forwarded-Proto: https. Without this, php-fpm (proxy_fcgi) sees no
# HTTPS server var, so Symfony's Request::isSecure() returns false and the core
# and portal session cookies are issued without the Secure flag on the live
# HTTPS site (AUDIT S2/S3). Map the edge protocol onto the standard HTTPS server
# var so isSecure() — and every $_SERVER['HTTPS'] check in the codebase — is
# correct behind the proxy. proxy_fcgi forwards SetEnvIf-set vars to php-fpm.
#
# Safe here because the container is reachable ONLY via Railway's edge proxy, so
# an external client cannot spoof X-Forwarded-Proto directly. Do NOT reuse this
# on a directly-internet-exposed container.
SetEnvIfNoCase X-Forwarded-Proto "^https$" HTTPS=on
